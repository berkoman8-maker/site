<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>GlitchGrid — XOX</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/xox.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="js/sw-register.js" defer></script>
</head>
<body>
<header id="navbar" class="navbar"></header>
<main class="xox-page">

  <!-- ══ ANA MENÜ ══ -->
  <div id="xox-menu" class="xox-screen">
    <div class="xox-hero">
      <div class="xox-hero-symbols">
        <span class="xox-x-big">✕</span>
        <span class="xox-o-big">◯</span>
      </div>
      <h1 class="orbitron gradient-text">XOX</h1>
      <p class="text-muted">Üç dizi yap, kazan!</p>
    </div>
    <div class="xox-menu-btns">
      <button class="btn xox-mode-btn xox-ai-btn" onclick="startVsAI()">
        <i class="fa-solid fa-robot"></i>
        <span>Yapay Zekaya Karşı</span>
        <small>Solo oyna</small>
      </button>
      <button class="btn xox-mode-btn xox-local-btn" onclick="startLocal()">
        <i class="fa-solid fa-users"></i>
        <span>Aynı Cihaz</span>
        <small>2 oyuncu, sırayla</small>
      </button>
      <button class="btn xox-mode-btn xox-online-btn" onclick="showOnlineMenu()">
        <i class="fa-solid fa-wifi"></i>
        <span>Online Lobi</span>
        <small>Arkadaşınla oyna</small>
      </button>
    </div>

    <!-- AI Zorluk seçimi -->
    <div class="xox-ai-opts hidden" id="xox-ai-opts">
      <p class="text-muted" style="text-align:center;margin-bottom:.75rem">Zorluk seç:</p>
      <div class="opt-group" style="justify-content:center">
        <button class="opt-btn active" data-val="easy"    onclick="setAIDiff(this)">Kolay</button>
        <button class="opt-btn"        data-val="medium"  onclick="setAIDiff(this)">Orta</button>
        <button class="opt-btn"        data-val="hard"    onclick="setAIDiff(this)">Zor</button>
        <button class="opt-btn"        data-val="perfect" onclick="setAIDiff(this)">Yenilmez</button>
      </div>
      <div class="xox-symbol-pick" id="xox-symbol-pick">
        <p class="text-muted" style="text-align:center;margin-bottom:.5rem">Sembolünü seç:</p>
        <div style="display:flex;gap:1rem;justify-content:center">
          <button class="xox-sym-btn active" id="pick-x" onclick="pickSymbol('X')">✕ X</button>
          <button class="xox-sym-btn"        id="pick-o" onclick="pickSymbol('O')">◯ O</button>
        </div>
      </div>
      <button class="btn btn-primary btn-full mt-2" onclick="launchVsAI()">
        <i class="fa-solid fa-play"></i> Başla
      </button>
    </div>

    <!-- Online lobi menüsü -->
    <div class="xox-online-opts hidden" id="xox-online-opts">
      <div class="xox-lobby-grid">
        <!-- Oluştur -->
        <div class="xox-lobby-panel">
          <h3 class="orbitron" style="font-size:.92rem;margin-bottom:.85rem">
            <i class="fa-solid fa-plus" style="color:var(--primary2)"></i> Lobi Oluştur
          </h3>
          <div class="form-field">
            <label>Lobi Adı</label>
            <div class="input-wrap">
              <i class="fa-solid fa-flag input-icon"></i>
              <input class="gz-input" id="xox-lobby-name" placeholder="Efsane Düello" maxlength="24"/>
            </div>
          </div>
          <div class="form-field mt-1">
            <label>Şifre <small class="text-muted">(opsiyonel)</small></label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock input-icon"></i>
              <input class="gz-input" id="xox-lobby-pass" type="password" placeholder="Şifresiz = herkese açık"/>
            </div>
          </div>
          <button class="btn btn-primary btn-full mt-2" onclick="createXoxLobby()">
            <i class="fa-solid fa-plus"></i> Oluştur
          </button>
        </div>
        <!-- Listele / Katıl -->
        <div class="xox-lobby-panel">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
            <h3 class="orbitron" style="font-size:.92rem">
              <i class="fa-solid fa-list" style="color:var(--cyan)"></i> Açık Lobiler
            </h3>
            <button class="btn btn-secondary btn-sm" onclick="refreshXoxLobbies()">
              <i class="fa-solid fa-rotate"></i>
            </button>
          </div>
          <div id="xox-lobby-list" class="xox-lobby-list">
            <p class="no-lobbies-msg">Henüz lobi yok.</p>
          </div>
          <div style="display:flex;gap:.5rem;margin-top:.75rem">
            <div class="input-wrap" style="flex:1">
              <i class="fa-solid fa-hashtag input-icon"></i>
              <input class="gz-input" id="xox-join-id" placeholder="Lobi ID ile katıl"/>
            </div>
            <button class="btn btn-secondary" onclick="joinXoxById()">Katıl</button>
          </div>
        </div>
      </div>
    </div>

    <!-- En yüksek skorlar -->
    <div class="xox-stats-bar" id="xox-stats-bar"></div>
  </div>

  <!-- ══ BEKLEME ODASI ══ -->
  <div id="xox-waiting" class="xox-screen hidden">
    <div class="xox-wait-card">
      <h2 class="orbitron" id="xox-wait-title">Lobi Bekleniyor</h2>
      <p class="text-muted" id="xox-wait-sub">Rakip bekleniyor...</p>
      <div class="xox-wait-players" id="xox-wait-players"></div>
      <div class="xox-wait-info" id="xox-wait-info"></div>
      <div class="xox-wait-share">
        <span class="text-muted" style="font-size:.8rem">Lobi ID:</span>
        <code id="xox-share-id" class="lobby-id-code">—</code>
        <button class="btn btn-secondary btn-sm" onclick="copyXoxId()">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
      <div style="display:flex;gap:.75rem;margin-top:1rem">
        <button class="btn btn-primary btn-full" id="xox-start-btn" onclick="startXoxFromLobby()" disabled>
          <i class="fa-solid fa-play"></i> Başlat
        </button>
        <button class="btn btn-secondary" onclick="leaveXoxLobby()">
          <i class="fa-solid fa-door-open"></i> Çık
        </button>
      </div>
    </div>
  </div>

  <!-- ══ OYUN TAHTASI ══ -->
  <div id="xox-game" class="xox-screen hidden">
    <!-- Skor -->
    <div class="xox-scoreboard">
      <div class="xox-score-side" id="xox-p1-side">
        <div class="xox-sym x-sym" id="xox-p1-sym">✕</div>
        <div class="xox-player-name" id="xox-p1-name">—</div>
        <div class="xox-score-num" id="xox-p1-score">0</div>
      </div>
      <div class="xox-score-mid">
        <div class="xox-round-info orbitron" id="xox-round-info">Tur 1</div>
        <div class="xox-turn-indicator" id="xox-turn-ind">✕ oynuyor</div>
      </div>
      <div class="xox-score-side" id="xox-p2-side">
        <div class="xox-score-num" id="xox-p2-score">0</div>
        <div class="xox-player-name" id="xox-p2-name">—</div>
        <div class="xox-sym o-sym" id="xox-p2-sym">◯</div>
      </div>
    </div>

    <!-- Tahta -->
    <div class="xox-board-wrap">
      <div class="xox-board" id="xox-board">
        <!-- 9 hücre JS ile oluşturulur -->
      </div>
      <!-- Kazanan çizgisi -->
      <canvas class="xox-line-canvas" id="xox-line-canvas"></canvas>
    </div>

    <!-- Alt bar -->
    <div class="xox-game-bar">
      <button class="btn btn-secondary btn-sm" onclick="xoxNewRound()">
        <i class="fa-solid fa-rotate"></i> Yeni Tur
      </button>
      <button class="btn btn-secondary btn-sm" onclick="xoxQuit()">
        <i class="fa-solid fa-house"></i> Menü
      </button>
    </div>
  </div>

  <!-- ══ OYUN SONU OVERLAY ══ -->
  <div class="xox-result-overlay hidden" id="xox-result-overlay">
    <div class="xox-result-card pop-in">
      <div class="xox-result-emoji" id="xox-result-emoji">🏆</div>
      <h2 class="orbitron" id="xox-result-title">Kazandın!</h2>
      <p class="text-muted" id="xox-result-sub">—</p>
      <div class="xox-result-reward" id="xox-result-reward"></div>
      <div style="display:flex;gap:.75rem;justify-content:center;margin-top:1.25rem">
        <button class="btn btn-primary" onclick="xoxNewRound()">
          <i class="fa-solid fa-rotate"></i> Tekrar
        </button>
        <button class="btn btn-secondary" onclick="xoxQuit()">
          <i class="fa-solid fa-house"></i> Menü
        </button>
      </div>
    </div>
  </div>

</main>
<div id="gz-toast"></div>
<script src="js/auth.js"></script>
<script src="js/music.js"></script>
<script src="js/feedback.js"></script>
<script src="js/xox.js"></script>
</body>
</html>
